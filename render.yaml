services:
  - type: web
    name: job-application-ai-agent-backend
    env: python
    rootDir: backend
    buildCommand: "uv sync && uv run playwright install chromium"
    startCommand: "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./app.db
